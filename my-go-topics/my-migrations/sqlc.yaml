version: "2"

sql:
  # --- Public schema — command (write) ---
  - engine: "postgresql"
    schema:
      - "internal/infrastructure/db/migrations/public"
    queries:
      - "internal/infrastructure/db/queries/command/public"
    gen:
      go:
        package: "commanddb"
        out: "internal/infrastructure/db/sqlc/command/public"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  # --- Tenant schema — command (write) ---
  - engine: "postgresql"
    schema:
      - "internal/infrastructure/db/migrations/tenant"
    queries:
      - "internal/infrastructure/db/queries/command/tenant"
    gen:
      go:
        package: "commanddb"
        out: "internal/infrastructure/db/sqlc/command/tenant"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  # --- Public schema — query (read) ---
  - engine: "postgresql"
    schema:
      - "internal/infrastructure/db/migrations/public"
    queries:
      - "internal/infrastructure/db/queries/query/public"
    gen:
      go:
        package: "querydb"
        out: "internal/infrastructure/db/sqlc/query/public"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  # --- Tenant schema — query (read) ---
  - engine: "postgresql"
    schema:
      - "internal/infrastructure/db/migrations/tenant"
    queries:
      - "internal/infrastructure/db/queries/query/tenant"
    gen:
      go:
        package: "querydb"
        out: "internal/infrastructure/db/sqlc/query/tenant"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
