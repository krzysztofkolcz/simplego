version: "2"

sql:
  - engine: "postgresql"

    schema:
      - "internal/infrastructure/db/migrations/public"
      - "internal/infrastructure/db/migrations/tenant"

    queries:
      - "internal/infrastructure/db/queries"

    gen:
      go:
        package: "sqlc"
        out: "internal/infrastructure/db/sqlc"

        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"