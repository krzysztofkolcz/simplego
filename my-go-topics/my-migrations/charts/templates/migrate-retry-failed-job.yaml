{{- if .Values.migrateRetry.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "charts.fullname" . }}-migrate-retry-{{ .Release.Revision }}
  # BRAK helm.sh/hook — to nie jest hook, to zwykły Job
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z $DB_HOST 5432; do sleep 2; done"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: DB_HOST
      containers:
        - name: migrate-retry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["/app", "retry-failed"]
          env:
{{ toYaml .Values.app.env | indent 12 }}
{{- end }}