replicaCount: 1

image:
  repository: go-hello-registry:5000/kkolcz/go-migrations
  pullPolicy: IfNotPresent
  tag: "0.0.34"

service:
  type: ClusterIP
  port: 80

container:
  port: 8080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

migrate:
  enabled: true

migrateRetry:
  enabled: false   # domyślnie wyłączone

app:
  name: go-migrations
  env:
    - name: APP_NAME
      value: "go-migrations-app"

    - name: DB_NAME
      valueFrom:
        secretKeyRef:
          name: postgresql-secret
          key: DB_NAME

    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: postgresql-secret
          key: DB_USER

    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: postgresql-secret
          key: DB_PASS

    - name: DB_PORT
      valueFrom:
        secretKeyRef:
          name: postgresql-secret
          key: DB_PORT

    - name: DB_HOST
      valueFrom:
        secretKeyRef:
          name: postgresql-secret
          key: DB_HOST