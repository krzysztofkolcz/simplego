version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries/todo.sql"
    schema: "db/schema/schema.sql"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/infrastructure/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
